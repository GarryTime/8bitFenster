<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* =====================================================================
   AQUARIUM – TASTENBELEGUNG (Kurzwahltasten)
   ---------------------------------------------------------------------
   Hier legst du fest, welche Taste welche Funktion auslöst.
   Jede Funktion bekommt eine Liste von Tasten in eckigen Klammern.

   Zwei Schreibweisen sind möglich:
     • Tastencode, z. B. 'Numpad7' oder 'KeyF'
       Beschreibt die PHYSISCHE Taste. Beim Ziffernblock ist das egal,
       ob NumLock an oder aus ist. Empfohlen für Ziffernblöcke.
     • Zeichen, z. B. 'f' oder 'z'
       Beschreibt das, was auf der Taste steht. Empfohlen für Buchstaben,
       weil z. B. auf deutschen Tastaturen Z und Y vertauscht sind.

   Mehrere Tasten für eine Funktion:   add1: ['Numpad7', 'f'],
   Funktion ohne Taste:                add1: [],
   Doppelt drücken (kurz hintereinander): '2x:' davor, z. B. '2x:Numpad9'.
     Hat eine Taste auch eine Doppel-Belegung, wartet die einfache
     Belegung einen kurzen Moment, ob ein zweiter Druck folgt.
   Groß-/Kleinschreibung ist egal. Jede Taste sollte nur EINMAL vorkommen.

   Pfeiltasten und Enter (Fernbedienung) steuern das Menü, solange sie
   hier nicht belegt sind. Strg-, Alt- und Cmd-Kombinationen bleiben
   immer beim Browser.

   Code einer Taste herausfinden: unten KIOSK_SHOW_KEYCODES auf true
   setzen, Datei neu laden und die Taste drücken. Der Code wird oben
   eingeblendet.
   ===================================================================== */
window.KIOSK_KEYS = {
  //           Ziffernblock          Tastatur
  give:      ['Numpad0',            'Space'],  // Futter & Co. (zufällig, nie zweimal gleich)
  add1:      ['Numpad7',            'f'],      // neuer Fisch
  add2:      ['Numpad8',            'k'],      // neue Krabbe
  add3:      ['Numpad9',            'p'],      // neue Pflanze
  add4:      ['2x:Numpad9',         'q'],      // 9 zweimal kurz: neue Qualle
  event:     ['Numpad4',            'e'],      // besonderes Ereignis starten
  main:      ['Numpad5',            'g'],      // an die Scheibe klopfen
  env:       ['Numpad6',            'r'],      // neue Zufallsumgebung
  season:    ['Numpad1',            'j'],      // Jahreszeit: Auto, Frühling, Sommer, Herbst, Winter
  occasion:  ['Numpad3',            'a'],      // Anlass: Auto, keiner, Silvester … Weihnachten
  light:     ['NumpadDivide',       'l'],      // Licht: Auto/Morgen/Tag/Abend/Nacht
  sound:     ['NumpadMultiply',     'm', 'MediaPlayPause'],  // Ton an/aus
  trackPrev: ['NumpadSubtract',     'MediaTrackPrevious'],  // voriger Musiktrack (auch Umschalt+T)
  track:     ['NumpadAdd',          't', 'MediaTrackNext'], // nächster Musiktrack
  zen:       ['2x:NumpadEnter',     'z'],      // Enter zweimal kurz: Ruhemodus (startet auch von selbst)
  help:      ['NumpadDecimal',      'h'],      // Tastenbelegung anzeigen
  menu:      ['NumpadEnter'],                  // Menü öffnen; darin wählen 8/2/4/6, Enter oder 5 bestätigt
  back:      ['Backspace',          'Escape'], // Menü/Fenster schließen, Ruhemodus beenden
  // Die Num-Taste wird absichtlich ignoriert: Viele Funk-Ziffernblöcke senden
  // bei jedem Tastendruck heimlich NumLock-Signale mit. Deshalb kann sie
  // nicht belegt werden.

  // Diese Funktionen liegen standardmäßig nur im Menü:
  color:     ['c'],                            // Farbfilter wechseln
  toasts:    ['n'],                            // Meldungen an/aus
  date:      ['d'],                            // Datum und Uhrzeit stellen
  reset:     ['x'],                            // Aquarium zurücksetzen (zweimal drücken)

  // Weitere Beispiele (zum Aktivieren in eine Liste oben übernehmen):
  // add1: ['Numpad7', 'f', 'F1'],
  // give: ['Numpad0', 'Space', 'Insert'],
};

/* =====================================================================
   WEITERE EINSTELLUNGEN
   ===================================================================== */
window.KIOSK_SETTINGS = {
  // Datum und Uhrzeit
  zeit: 'auto',                    // 'auto' = Gerätezeit (mit Schutz gegen Rücksprünge)
                                   // 'fest' = immer das Datum aus festesDatum verwenden
  festesDatum: '2026-12-24 12:00', // nur bei zeit: 'fest'  (JJJJ-MM-TT HH:MM)
  datumBeimStartBestaetigen: true, // nach dem Einschalten 30 s lang Datum zur Bestätigung zeigen
  tagNacht: 'auto',                // 'auto' = Licht folgt der Uhrzeit, 'taste' = nur per Licht-Taste

  // Kiosk
  leistung: 'hoch',                // 'hoch' = 60 Bilder/s, 'niedrig' = 30 Bilder/s (für schwache Geräte)
  ruhemodusNachSekunden: 40,       // ohne Eingabe nach so vielen Sekunden in den Ruhemodus (0 = nie)

  // Eigene Anlässe: datum als 'TT.MM.', art: 'geburtstag' oder 'feier'
  anlaesse: [
    { datum: '08.05.', name: 'Geburtstag', art: 'geburtstag' },
    { datum: '10.06.', name: 'Geburtstag', art: 'geburtstag' },
  ],
};

window.KIOSK_SHOW_KEYCODES = false;

/* ---------------------------------------------------------------------
   TASTENCODES, die auf den meisten Tastaturen funktionieren
   ---------------------------------------------------------------------
   Ziffernblock:
     // 'Numpad0' … 'Numpad9'      Ziffern 0–9
     // 'NumpadDecimal'            Komma/Punkt (Del)
     // 'NumpadComma'              Komma (nur auf manchen Blöcken)
     // 'NumpadAdd'                +
     // 'NumpadSubtract'           −
     // 'NumpadMultiply'           *
     // 'NumpadDivide'             /
     // 'NumpadEnter'              Enter auf dem Ziffernblock
     // 'NumpadEqual'              = (nur auf manchen Blöcken)
     // 'NumLock'                  Num Lock (wird ignoriert, siehe oben)
     // 'Backspace'                Rücktaste (auf vielen Funk-Ziffernblöcken)
   Hinweis: Manche Funk-Ziffernblöcke senden bei ausgeschaltetem NumLock
   echte Navigationstasten statt Numpad-Codes. Dann NumLock einschalten
   oder zusätzlich die Codes darunter eintragen:
     // 7 → 'Home'   8 → 'ArrowUp'   9 → 'PageUp'
     // 4 → 'ArrowLeft'   6 → 'ArrowRight'
     // 1 → 'End'    2 → 'ArrowDown' 3 → 'PageDown'
     // 0 → 'Insert' , → 'Delete'
   Buchstaben und Ziffern (Haupttastatur):
     // 'KeyA' … 'KeyZ'            (US-Position! Auf QWERTZ ist 'KeyY' die Z-Taste)
     // 'Digit0' … 'Digit9'        Ziffernreihe
     // 'a' … 'z', '0' … '9'       als Zeichen, unabhängig vom Layout
   Funktions- und Steuertasten:
     // 'F1' … 'F12'               (F11 und F5 belegen viele Browser selbst)
     // 'Space'                    Leertaste
     // 'Enter'                    Enter / OK auf der Fernbedienung
     // 'Escape'                   Esc
     // 'Backspace'                Rücktaste
     // 'Tab'                      Tabulator
     // 'Insert'  'Delete'         Einfg / Entf
     // 'Home'    'End'            Pos1 / Ende
     // 'PageUp'  'PageDown'       Bild auf / Bild ab
     // 'ArrowUp' 'ArrowDown' 'ArrowLeft' 'ArrowRight'   Pfeiltasten
     // 'ContextMenu'              Menütaste
     // 'ScrollLock'  'Pause'  'PrintScreen'  (PrintScreen fängt oft das System ab)
   Satzzeichen (Position wie auf US-Tastaturen):
     // 'Minus'  'Equal'  'BracketLeft'  'BracketRight'  'Backslash'
     // 'Semicolon'  'Quote'  'Backquote'  'Comma'  'Period'  'Slash'
     // 'IntlBackslash'            Taste < > | links neben Y (deutsche Tastatur)
   Medien- und Sondertasten (je nach Gerät und System):
     // 'MediaPlayPause'  'MediaTrackNext'  'MediaTrackPrevious'  'MediaStop'
     // 'BrowserBack'  'BrowserForward'  'BrowserHome'
     // 'AudioVolumeUp'  'AudioVolumeDown'  'AudioVolumeMute'  (oft vom System belegt)
   Fernbedienung (Android TV / Shield):
     // 'ArrowUp' 'ArrowDown' 'ArrowLeft' 'ArrowRight'  Steuerkreuz
     // 'Enter'                    OK
     // 'GoBack' / 'BrowserBack'   Zurück (nicht in jedem Browser abfangbar)
   --------------------------------------------------------------------- */
</script>

<style>
:root{
  --panel:#f8f8f0; --ink:#181830; --edge:#181830; --hi:#dcdcff; --muted:#55508a;
  --key:#6868d8; --keyhi:#d8d8ff; --keylo:#30308a; --keyfg:#ffffff; --accent:#e03838;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#1c1a3c; --ink:#ecebff; --edge:#000000; --hi:#2e2c60; --muted:#a8a4dc;
    --key:#5c5cd8; --keyhi:#a0a0ff; --keylo:#20205a; --keyfg:#ffffff; --accent:#f05050;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#1c1a3c; --ink:#ecebff; --edge:#000000; --hi:#2e2c60; --muted:#a8a4dc;
  --key:#5c5cd8; --keyhi:#a0a0ff; --keylo:#20205a; --keyfg:#ffffff; --accent:#f05050;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#0a1640}
body{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);-webkit-user-select:none;user-select:none}
body:focus,#screen:focus{outline:none}
#screen{position:fixed;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
#menu{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(680px,calc(100vw - 24px));max-height:calc(100% - 40px);overflow:auto;
  background:var(--panel);border:3px solid var(--edge);box-shadow:5px 5px 0 var(--edge);
  padding:10px;font-size:clamp(8px,1.1vw + 3px,11px);line-height:1.5;
  opacity:0;transform:translate(-50%,10px);pointer-events:none;
  transition:opacity .2s steps(3),transform .2s steps(3);
}
#menu.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:2px 4px 9px;margin-bottom:8px;border-bottom:3px solid var(--edge)}
.stats b{color:var(--accent);font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:4px}
#menu button{
  all:unset;display:flex;align-items:center;gap:9px;padding:6px;cursor:pointer;
  border:2px solid transparent;color:var(--ink);font:inherit;
}
#menu button:hover{background:var(--hi);border-color:var(--edge)}
#menu button:focus-visible{background:var(--hi);border-color:var(--edge);outline:3px solid var(--accent);outline-offset:1px}
kbd{
  font:inherit;font-size:.9em;min-width:2.6em;text-align:center;padding:4px 3px;flex:none;
  background:var(--key);color:var(--keyfg);
  border-top:3px solid var(--keyhi);border-left:3px solid var(--keyhi);
  border-right:3px solid var(--keylo);border-bottom:3px solid var(--keylo);
}
#menu button em{font-style:normal;color:var(--muted)}
.tip{margin:8px 4px 2px;color:var(--muted);font-size:.85em}
#toast{
  position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--panel);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);
  padding:9px 12px;font-size:clamp(8px,1vw + 3px,11px);line-height:1.5;max-width:calc(100vw - 24px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s steps(3);
}
#toast.show{opacity:1}
#keypad{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  background:var(--panel);border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge);
  padding:14px;max-width:calc(100vw - 20px);max-height:calc(100% - 20px);overflow:auto;
  font-size:clamp(7px,1vw + 3px,11px);line-height:1.5;
}
#keypad[hidden]{display:none}
#datebox{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;
  background:var(--panel);border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge);
  padding:16px 18px;max-width:calc(100vw - 20px);font-size:clamp(8px,1vw + 4px,12px);line-height:1.6;text-align:center;
}
#datebox[hidden]{display:none}
.db-value{font-size:1.7em;margin:10px 0;color:var(--accent);letter-spacing:.05em;white-space:nowrap}
.kp-head{margin:0 0 12px;padding-bottom:9px;border-bottom:3px solid var(--edge)}
.kp-grid{display:grid;grid-template-columns:repeat(4,minmax(62px,112px));grid-auto-rows:minmax(62px,auto);gap:6px}
.kp-cell{
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:7px;
  background:var(--hi);border-top:3px solid var(--keyhi);border-left:3px solid var(--keyhi);
  border-right:3px solid var(--keylo);border-bottom:3px solid var(--keylo);
}
.kp-cell b{font-weight:normal;font-size:1.3em;color:var(--accent)}
.kp-cell span{overflow-wrap:anywhere}
.kp-note{margin:12px 0 0;color:var(--muted)}
.kp-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.kp-actions button{
  font:inherit;padding:8px 10px;cursor:pointer;color:var(--keyfg);background:var(--key);
  border-top:3px solid var(--keyhi);border-left:3px solid var(--keyhi);border-right:3px solid var(--keylo);border-bottom:3px solid var(--keylo);
}
.kp-actions button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media print{
  html,body{background:#fff !important;overflow:visible !important;height:auto}
  body > *:not(#keypad){display:none !important}
  #keypad{display:block !important;position:static;transform:none;box-shadow:none;border:none;max-height:none;color:#000;background:#fff;font-size:5.5pt}
  .kp-grid{grid-template-columns:repeat(4,18mm);grid-auto-rows:18mm;gap:2mm}
  .kp-cell{background:#fff;border:0.3mm dashed #000;padding:1.2mm}
  .kp-cell b{color:#000}
  .kp-actions,.kp-note{display:none}
}
body.zen #menu, body.zen #toast, body.zen #keypad{display:none}
body.zen #screen{cursor:none}
@media (prefers-reduced-motion:reduce){#menu,#toast{transition:none}}
</style>

function newPlant(R){
  const r = R();
  const type = r < .5 ? 0 : r < .75 ? 1 : 2;
  return { type, x:R(), h: type === 0 ? .14 + R()*.22 : type === 1 ? .05 + R()*.05 : .07 + R()*.08,
    ph:R()*6.28, seed:(R()*1e9)|0, color:(R()*3)|0 };
}
function genEnv(seed){
  const R = mulberry(seed);
  const e = { seed, water:R()*3|0, sand:R()*3|0, plantS:R()*3|0,
    a1:1 + R()*2.5, f1:.03 + R()*.05, p1:R()*6.28, a2:.5 + R()*1.5, f2:.12 + R()*.1, p2:R()*6.28,
    ridge:R()*6.28, chestX:.1 + R()*.8, bubblerX:R(), rocks:[], bgPlants:[], plants:[] };
  const nr = 3 + (R()*4|0);
  for (let i = 0; i < nr; i++) e.rocks.push({ x:R(), rx:3 + (R()*7|0), ry:2 + (R()*4|0) });
  const nb = 4 + (R()*4|0);
  for (let i = 0; i < nb; i++) e.bgPlants.push({ x:R(), h:.2 + R()*.22 });

  for (let i = 0; i < nc; i++) e.crabs.push(R() * CRAB_TYPES.length | 0);
  return e;
}

// ================= Geometry & background =================
function computeSand(){
  sandArr = new Int16Array(W);
  HS = H - Math.max(14, Math.round(H * .12));
  for (let x = 0; x < W; x++)
    sandArr[x] = Math.round(HS + env.a1*Math.sin(x*env.f1 + env.p1) + env.a2*Math.sin(x*env.f2 + env.p2));
}
const sandTop = x => sandArr[Math.max(0, Math.min(W - 1, Math.round(x)))];
const chestX = () => Math.round(env.chestX * (W - 24)) + 6;
const bubblerX = () => Math.round(env.bubblerX * (W - 12)) + 6;

function rock(cx, cy, rx, ry){
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++){
    const e = x*x/(rx*rx) + y*y/(ry*ry);
    if (e > 1) continue;
    const px = cx + x, py = cy + y;
    if (px < 0 || py < 0 || px >= W || py >= H) continue;
    let c;
    if (e > .78) c = pal.rock[3];
    else { const s = x/rx + y/ry; c = s < -.7 ? pal.rock[0] : s < .3 ? pal.rock[1] : pal.rock[2]; }
    bg[py*W + px] = c; mask[py*W + px] = 0;
  }
}
function buildBg(){
  tgt = bg;
  const R = mulberry(env.seed ^ 0x5bd1);
  const n = pal.water.length;
  for (let y = 0; y < H; y++){
    const f = y / (H - 1) * (n - 1), i = Math.floor(f), fr = f - i;
    for (let x = 0; x < W; x++){
      bg[y*W + x] = pal.water[fr > BAYER[y&3][x&3] ? Math.min(n - 1, i + 1) : i];
      mask[y*W + x] = 1;
    }
  }
  for (let x = 0; x < W; x++){
    const top = sandTop(x) - Math.round(H*.05) - Math.round(4*Math.sin(x*.05 + env.ridge) + 3*Math.sin(x*.13 + env.ridge*2));
    for (let y = Math.max(0, top); y < sandTop(x); y++){ bg[y*W + x] = pal.bg2; mask[y*W + x] = 0; }
  }
  for (const k of env.bgPlants){
    const x0 = Math.round(k.x * W), h = Math.round(k.h * H), yb = sandTop(x0);
    for (let i = 0; i < h; i++){
      const x = x0 + Math.round(Math.sin(i*.12 + k.x*40) * 2), y = yb - i;
      for (const dx of [0, 1]) if (x+dx >= 0 && x+dx < W && y >= 0){ bg[y*W + x + dx] = pal.bg1; mask[y*W + x + dx] = 0; }
      if (i % 7 === 4) for (const dx of [-2, -1, 2, 3]){
        const px = x + dx, py = y - 1;
        if (px >= 0 && px < W && py >= 0){ bg[py*W + px] = pal.bg2; mask[py*W + px] = 0; }
      }
    }
  }
  for (let x = 0; x < W; x++){
    const st = sandTop(x);
    for (let y = st; y < H; y++){
      const d = y - st;
      let idx = d === 0 ? 0 : d < 3 ? 1 : d < 8 ? 2 : 3;
      const r = R();
      if (r < .12) idx = Math.max(0, idx - 1); else if (r > .92) idx = Math.min(3, idx + 1);
      bg[y*W + x] = pal.sand[idx]; mask[y*W + x] = 0;
    }
  }
  for (let i = 0; i < W / 8; i++){
    const x = (R() * W) | 0, y = sandTop(x) + 2 + ((R() * 8) | 0);
    if (y < H) bg[y*W + x] = pal.rock[R() < .5 ? 1 : 2];
  }
  for (const r of env.rocks){ const x = Math.round(r.x * W); rock(x, sandTop(x) + (r.ry > 3 ? -1 : 1), r.rx, r.ry); }
  rock(bubblerX(), sandTop(bubblerX()), 3, 2);
  tgt = buf;
}

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight, hd = scene() && scene().hd;
  let s = Math.max(2, Math.round(Math.min(vw, vh) / (hd ? 216 : 150)));
  while (vw / s > (hd ? 600 : 420) || vh / s > (hd ? 600 : 420)) s++;
  const nW = Math.ceil(vw / s), nH = Math.ceil(vh / s);
  const changed = nW !== W || nH !== H || !buf;
  const rx = buf ? nW / W : 1, ry = buf ? nH / H : 1;
  S = s;
  cv.style.width = nW * s + 'px'; cv.style.height = nH * s + 'px';
  if (!changed) return;
  W = nW; H = nH;
  cv.width = W; cv.height = H;
  img = ctx.createImageData(W, H);
  buf = new Uint32Array(img.data.buffer);
  bg = new Uint32Array(W * H);
  mask = new Uint8Array(W * H);
  tgt = buf;
  const sc = scene();
  if (sc && sc.inited){ if (sc._W && (sc._W !== W || sc._H !== H)) sc.resize(W / sc._W, H / sc._H); sc._W = W; sc._H = H; sc.activate(); }
  if (trans) trans.rs = true;
}
function aquaResize(rx, ry){

  for (const e of eggs) e.x *= rx;
  food = []; bubbles = []; puffs = []; inks = []; zs = []; fx = []; penguins = []; ball = null; pearl = null; decoSig = '';
  ev.turtle = ev.swarm = ev.whale = ev.big = ev.sub = null;

}
function aquaActivate(){ compilePal(); computeSand(); buildBg(); buildDeco(); }
function initPlankton(){

// ================= Fish =================
function setStage(f, stage){
  f.stage = stage;
  f.fr = stage === 'fry' ? FRY : SPR[f.s.spr];
  f.w = f.fr[0][0].length; f.h = f.fr[0].length;
}
function newTarget(f){
  const night = phase === 'night' && f.stage === 'adult';
  f.tx = 2 + rnd() * Math.max(1, W - 4 - f.w);
  f.ty = night ? HS*.5 + rnd() * Math.max(1, HS*.45 - f.h) : 6 + rnd() * Math.max(1, HS - 14 - f.h);
}
function addFish(sp, stage = 'adult', x, y){
  if (fish.length >= MAXF) return null;
  const s = SPECIES[sp];
  const f = { id:nextId++, sp, s, x:0, y:0, vx:0, vy:0, dir:rnd() < .5 ? 1 : -1, anim:rnd()*2,
    tx:0, ty:0, growth:0, scared:0 };
  setStage(f, stage);
  f.x = x !== undefined ? x : 4 + rnd() * Math.max(1, W - 16);
  f.y = y !== undefined ? y : 10 + rnd() * Math.max(1, HS*.6);
  newTarget(f); fish.push(f);
  return f;
}
const randomSpecies = () => rnd() < .05 ? GOLD : NORMAL_SPECIES[rnd() * NORMAL_SPECIES.length | 0];

function updateFish(f){
  const night = phase === 'night';
  if (f.stage === 'fry'){ f.growth += 1/7200; if (f.growth >= 1){ setStage(f, 'adult'); f.growth = 0; } }
  let tx = f.tx, ty = f.ty, sp = f.s.speed * (f.stage === 'fry' ? 1.2 : 1), target = null;
  if (f.scared > 0){ f.scared--; sp *= 3.2; }
  else {
    let bd = 1e9;
    for (const fd of food){
      if (fd.kind === 'tab') continue;
      const d = (fd.x - (f.x + f.w/2))**2 + (fd.y - (f.y + f.h/2))**2;
      if (d < bd){ bd = d; target = fd; }
    }
    if (target){ tx = target.x - f.w/2; ty = target.y - f.h/2; sp *= 1.8; }
    else if (night && f.stage === 'adult') sp *= .3;
  }
  const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1;
  if (!target && !f.scared && (d < 3 || rnd() < .002)) newTarget(f);
  f.vx += (dx/d*sp - f.vx) * .04;
  f.vy += (dy/d*sp*.6 - f.vy) * .04;
  f.x += f.vx; f.y += f.vy;
  f.x = Math.max(1, Math.min(W - f.w - 1, f.x));
  f.y = Math.max(6, Math.min(sandTop(f.x + f.w/2) - f.h - 1, f.y));
  if (f.vx > .06) f.dir = 1; else if (f.vx < -.06) f.dir = -1;
  f.anim += .05 + Math.hypot(f.vx, f.vy) * .25;
  if (target){
    const cx = f.x + f.w/2, cy = f.y + f.h/2;
    if (Math.abs(target.x - cx) < f.w/2 + 1 && Math.abs(target.y - cy) < f.h/2 + 1){
      food.splice(food.indexOf(target), 1);
      fed++; f.growth += f.stage === 'fry' ? .2 : .25;
      fx.push({ kind:'heart', x:f.x + f.w/2 - 2, y:f.y - 5, vx:0, vy:-.15, life:50 });
      if (f.stage === 'fry' && f.growth >= 1){ setStage(f, 'adult'); f.growth = 0; }
    }
  }
  if (f.stage === 'adult' && f.growth >= 1 && fish.length + eggCount() < MAXF - 2 && rnd() < 1/600){
    eggs.push({ x:Math.max(2, Math.min(W - 4, f.x + f.w/2)), sp:f.sp, t:0, n:3 + (rnd()*3|0) });
    f.growth = 0;
  }
  if (rnd() < .003) bubble(f.dir > 0 ? f.x + f.w : f.x - 1, f.y + 2, 0);
  if (night && f.stage === 'adult' && !food.length && rnd() < 1/260) zs.push({ x:f.x + f.w/2, y:f.y - 3, life:100 });
}
const eggCount = () => eggs.reduce((a, e) => a + e.n, 0);

function bubble(x, y, s){ if (bubbles.length < 160) bubbles.push({ x0:x, x, y, s, ph:rnd()*6, v:.25 + rnd()*.15 + s*.08 }); }

// ================= Plants =================
function plantBase(pl){ const x0 = Math.round(pl.x * (W - 6)) + 3; return { x0, h:Math.max(4, Math.round(pl.h * H)), yb:sandTop(x0) + 1 }; }
const kelpOff = (pl, i, h) => Math.round(Math.sin(t*.035 + pl.ph + i*.16) * (i/h) * 3.2);
const bushOff = (pl, i, h) => Math.round(Math.sin(t*.03 + pl.ph + i*.3) * (i/h) * 1.2);
function plantPoint(pl, frac){
  const { x0, h, yb } = plantBase(pl);
  const i = Math.round(h * frac);
  const off = pl.type === 0 ? kelpOff(pl, i, h) : pl.type === 1 ? bushOff(pl, i, h) : 0;
  return { x:x0 + off, y:yb - i };
}
function drawPlant(pl){
  const { x0, h, yb } = plantBase(pl);
  const P = pal.plant;
  if (pl.type === 0){
    for (let i = 0; i < h; i++){
      const x = x0 + kelpOff(pl, i, h), y = yb - i, alt = (i >> 1) & 1;
      tp(x, y, P[alt ? 1 : 2]); tp(x + 1, y, P[alt ? 0 : 1]);
      if (i % 6 === 3) tp(x + 2, y - 1, P[0]);
      if (i % 6 === 0 && i > 0) tp(x - 1, y - 1, P[1]);
    }
  } else if (pl.type === 1){
    for (let i = 0; i < h; i++){
      const x = x0 + bushOff(pl, i, h), y = yb - i;
      const wdt = Math.round(Math.sin(Math.PI * (i + 1) / (h + 1)) * 3) + 1;
      for (let dx = -wdt; dx <= wdt; dx++){
        const edge = Math.abs(dx) === wdt;
        tp(x + dx, y, edge ? P[2] : (dx < 0 && (i & 1)) ? P[0] : P[1]);
      }
    }
  } else {
    const col = pal.coral[pl.color];
    const R = mulberry(pl.seed);
    const branch = (x, y, len, dir, depth) => {
      for (let i = 0; i < len; i++){
        y--; if (dir && i % 2 === 0) x += dir;
        tp(x, y, col[1]); tp(x + 1, y, col[2]);
        if (depth < 3 && len > 3 && i === (len * .5 | 0)){
          if (R() < .85) branch(x, y, Math.max(2, len * .6 | 0), -1, depth + 1);
          if (R() < .85) branch(x + 1, y, Math.max(2, len * .6 | 0), 1, depth + 1);
        }
      }
      tp(x, y - 1, col[0]); tp(x + 1, y - 1, col[0]);
    };
    branch(x0, yb, Math.max(3, h * .55 | 0), 0, 0);
  }
}

function updateJelly(j){
  j.ph++;
  const c = j.ph % 150;
  if (c < 24) j.vy = -.32; else j.vy = Math.min(.08, j.vy + .01);
  j.y += j.vy; j.x += Math.sin(j.ph * .01) * .08;
  if (j.y < 8) j.y = 8;
  if (j.y > HS - 22) j.ph = 0;
  j.x = Math.max(2, Math.min(W - 9, j.x));
}
function drawJelly(j, glow){
  const P = glow ? JELLY_GLOW : JELLY_PAL;
  const c = j.ph % 150, fr = c < 12 ? 1 : 0;
  const rows = JELLY[fr], x0 = Math.round(j.x), y0 = Math.round(j.y);
  for (let r = 0; r < rows.length; r++) for (let i = 0; i < 7; i++){
    const ch = rows[r][i];
    if (ch === 'o') tp(x0 + i, y0 + r, P.o);
    else if (ch === 'h' && (glow || ((x0 + i + y0 + r) & 1) === 0)) tp(x0 + i, y0 + r, P.h);
  }
  for (const k of [1, 3, 5]) for (let r = 0; r < 7; r++){
    const x = x0 + k + Math.round(Math.sin(j.ph*.08 + r*.6 + k));
    tp(x, y0 + 4 + r, r % 2 ? P.o : P.h);
  }
}
function pickSeahorsePlant(){
  const cands = env.plants.map((p, i) => i).filter(i => env.plants[i].type !== 2 || rnd() < .3);
  if (!cands.length){ sh.plant = -1; return; }
  sh.plant = cands[rnd() * cands.length | 0];
  sh.hi = .45 + rnd() * .4; sh.state = 'move';
}
function seahorseAnchor(){
  const pl = env.plants[sh.plant];
  const p = plantPoint(pl, sh.hi);
  return { x:p.x - (sh.dir > 0 ? 3 : 2), y:p.y - 10 };
}
function updateSeahorse(){
  if (sh.plant < 0 || !env.plants[sh.plant]) pickSeahorsePlant();
  if (sh.plant < 0){ sh.y += Math.sin(t*.02)*.05; return; }
  const a = seahorseAnchor();
  if (sh.state === 'move'){
    const dx = a.x - sh.x, dy = a.y - sh.y, d = Math.hypot(dx, dy);
    if (Math.abs(dx) > .5) sh.dir = dx > 0 ? 1 : -1;
    if (d < 1){ sh.state = 'hold'; sh.hold = 600 + rnd()*900; sh.dir = plantBase(env.plants[sh.plant]).x0 > W/2 ? -1 : 1; }
    else { sh.x += dx/d * .14; sh.y += dy/d * .14; }
  } else {
    sh.x = a.x; sh.y = a.y + Math.round(Math.sin(t*.05));
    if (--sh.hold <= 0) pickSeahorsePlant();
  }
}
function updateOcto(){
  if (--oc.timer <= 0){ oc.tgtCamo = 1 - oc.camo; oc.trans = 32; oc.timer = 500 + rnd()*700; }
  if (oc.trans > 0 && --oc.trans === 0) oc.camo = oc.tgtCamo;
  if (oc.walk > 0){ oc.walk--; oc.x += oc.wdir * .08; oc.anim += .1; }
  else if (rnd() < .002){ oc.walk = 120 + rnd()*200; oc.wdir = rnd() < .5 ? -1 : 1; }
  if (oc.x < 2){ oc.x = 2; oc.wdir = 1; }
  if (oc.x > W - 11){ oc.x = W - 11; oc.wdir = -1; }
  if (oc.jump > 0) oc.jump--;
}
function drawOcto(){
  const camo = oc.trans > 0 ? ((oc.trans >> 2) & 1 ? oc.camo : oc.tgtCamo) : oc.camo;
  const P = camo ? { o:pal.sand[2], a:pal.sand[1], k:OCTO_PAL.k } : OCTO_PAL;
  const jy = oc.jump > 0 ? Math.round(Math.sin(Math.PI * oc.jump / 40) * 10) : 0;
  spr(OCTO[(oc.anim | 0) & 1], P, oc.x, sandTop(oc.x + 4) - 6 - jy);
}
function spawnCrabs(){
  crabs = (env.crabs && env.crabs.length ? env.crabs : [0]).map(ty => ({
    type:CRAB_TYPES[ty] ? ty : 0, x:4 + rnd() * Math.max(1, W - 20), dir:rnd() < .5 ? 1 : -1, wait:0, anim:rnd()*2, hidden:0 }));
}
function updateCrab(c){
  const T = CRAB_TYPES[c.type];
  if (c.hidden > 0){ c.hidden--; return; }
  let tab = null, bd = 1e9;
  for (const fd of food) if (fd.kind === 'tab' && fd.rest){ const d = Math.abs(fd.x - (c.x + 4)); if (d < bd){ bd = d; tab = fd; } }
  if (tab){
    c.wait = 0; c.dir = tab.x > c.x + 4 ? 1 : -1;
    c.x += c.dir * T.speed * 1.6; c.anim += .15;
    if (Math.abs(tab.x - (c.x + 4)) < 2){
      food.splice(food.indexOf(tab), 1); fed++;
      fx.push({ kind:'heart', x:c.x + 2, y:sandTop(c.x + 4) - 10, vx:0, vy:-.15, life:50 });
    }

}

      }

  for (let i = bubbles.length - 1; i >= 0; i--){

function schedMusic(){

  const list = scene().tracks, tr = list[sceneCfg().track] || list[0];
  const spb = 60 / tr.bpm / 2;
  if (musNext < AC.currentTime) musNext = AC.currentTime + .05;
  while (musNext < AC.currentTime + .3){
    const bar = (musStep >> 3) % 4, st = musStep & 7, ch = tr.chords[bar], at = musNext;
    const ai = tr.arp[st];

    const b = tr.bass[st];
    if (b >= 0) note(midi(ch[0] - 12 + b), spb * tr.bl, 'triangle', .3, 0, musBus, null, at);
    const m = tr.melody[musStep % 64];

      if (tr.echo) note(midi(m), spb * 1.5, wave(tr.mw), .025, 0, musBus, null, at + spb * 3);
    }
    if (tr.drums === 'hat'){

      if (st === 0 || st === 4) note(130, .12, 'sine', .35, 0, musBus, 45, at);

      if (st === 2 || st === 6) noise(.09, .14, at, musBus, 'lowpass', 2200);

    if (e.key === 'Escape' || code === 'Backspace'){ closeDate(false); return; }
    openDate('edit');
  }
  const NAVDIGIT = { Insert:'0', End:'1', ArrowDown:'2', PageDown:'3', ArrowLeft:'4', Clear:'5', ArrowRight:'6', Home:'7', ArrowUp:'8', PageUp:'9' };
  const m = code.match(/^(?:Numpad|Digit)(\d)$/), digit = m ? m[1] : /^[0-9]$/.test(e.key) ? e.key : NAVDIGIT[code] || NAVDIGIT[e.key] || null;
  if (digit !== null){ if (dateBuf.length < 12) dateBuf += digit; renderDate(); return; }
  if (code === 'Backspace' || e.key === 'Backspace'){ if (!dateBuf.length){ closeDate(false); return; } dateBuf = dateBuf.slice(0, -1); renderDate(); return; }
  if (e.key === 'Escape'){ closeDate(false); return; }
  if (e.key === 'Enter'){
    if (dateBuf.length < 12){ toast('Bitte alle 12 Ziffern eingeben.', true); return; }
    const n = [0, 2, 4, 8, 10].map((p, i) => +dateBuf.slice(p, i === 2 ? 8 : p + 2));
    const [D, M, Y, h, mi] = n, d = new Date(Y, M - 1, D, h, mi);
    if (Y < 2025 || d.getMonth() !== M - 1 || d.getDate() !== D || h > 23 || mi > 59){
      toast('Das Datum ist ungültig.', true); dateBuf = ''; renderDate(); return;
    }
    setClock(d.getTime()); closeDate(false);
    phase = computePhase(); computeSeasonOcc(); updateMenu();
    toast(`Datum gestellt: ${fmtDate(d)}`, true);
  }
}
menu.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => { const a = b.dataset.act; run(a); if (!QUIET.includes(a)) showMenu(); }));

const DEFAULT_KEYS = {
  give:['Numpad0','Space'], add1:['Numpad7','f'], add2:['Numpad8','k'], add3:['Numpad9','p'], add4:['2x:Numpad9','q'],
  event:['Numpad4','e'], main:['Numpad5','g'], env:['Numpad6','r'], season:['Numpad1','j'],
  occasion:['Numpad3','a'], light:['NumpadDivide','l'], sound:['NumpadMultiply','m','MediaPlayPause'],
  trackPrev:['NumpadSubtract','MediaTrackPrevious'], track:['NumpadAdd','t','MediaTrackNext'], zen:['2x:NumpadEnter','z'],
  help:['NumpadDecimal','h'], menu:['NumpadEnter'], back:['Backspace','Escape'],
  color:['c'], toasts:['n'], date:['d'], reset:['x']
};
const KEYSRC = window.KIOSK_KEYS || window.AQUARIUM_KEYS;
const KEY_ALIAS = { feed:'give', fish:'add1', crab:'add2', plant:'add3', jelly:'add4', knock:'main' };
const KEYCFG = {};
for (const [k, v] of Object.entries(KEYSRC && typeof KEYSRC === 'object' ? KEYSRC : DEFAULT_KEYS)) KEYCFG[KEY_ALIAS[k] || k] = v;
const ACTION_NAMES = { give:'Geben', add1:'Bewohner 1', add2:'Bewohner 2', add3:'Bewohner 3', add4:'Bewohner 4', event:'Ereignis', main:'Hauptaktion',
  env:'Neue Umgebung', season:'Jahreszeit', occasion:'Anlass', toasts:'Meldungen', sound:'Ton', light:'Licht',
  color:'Farben', trackPrev:'Track zurück', track:'Track vor', zen:'Ruhemodus', help:'Tastenbelegung', menu:'Menü', back:'Schließen',
  date:'Datum stellen', reset:'Zurücksetzen' };
const KEYBIND = new Map(), DOUBLEBIND = new Map();
for (const act of Object.keys(KEYCFG)){
  if (!ACTION_NAMES[act] || !Array.isArray(KEYCFG[act])) continue;
  for (const c of KEYCFG[act]){
    if (typeof c !== 'string' || !c) continue;
    if (/^2x:/i.test(c)) DOUBLEBIND.set(c.slice(3).toLowerCase(), act);
    else KEYBIND.set(c === ' ' ? 'space' : c.toLowerCase(), act);
  }
}
const lookupKey = e => KEYBIND.get((e.code || '').toLowerCase()) || KEYBIND.get(e.key === ' ' ? 'space' : (e.key || '').toLowerCase());
const KEY_LABELS = { space:'Leer', numlock:'Num', numpaddivide:'/', numpadmultiply:'*', numpadsubtract:'−', numpadadd:'+',
  numpadenter:'Enter', numpaddecimal:'.', numpadcomma:',', numpadequal:'=', backspace:'←', enter:'Enter', escape:'Esc', tab:'Tab',
  delete:'Entf', insert:'Einfg', home:'Pos1', end:'Ende', pageup:'Bild↑', pagedown:'Bild↓', arrowup:'↑', arrowdown:'↓',
  arrowleft:'←', arrowright:'→', mediaplaypause:'Play', mediatracknext:'Next', mediatrackprevious:'Prev', contextmenu:'Menü' };
function keyLabel(c){
  const l = c.toLowerCase();
  if (KEY_LABELS[l]) return KEY_LABELS[l];
  let m;
  if ((m = l.match(/^numpad(\d)$/)) || (m = l.match(/^digit(\d)$/))) return m[1];
  if ((m = l.match(/^key([a-z])$/))) return m[1].toUpperCase();
  if (/^f\d{1,2}$/.test(l)) return l.toUpperCase();
  if (c.length === 1) return c.toUpperCase();
  return c;
}
const isPadCode = c => /^(2x:)?(numpad|numlock$|backspace$)/i.test(c || '');
const isMedia = c => /^(media|browser|audio)/i.test(c || '');
function labelFor(act, mode){
  const list = (KEYCFG[act] || []).filter(c => typeof c === 'string' && c && !isMedia(c));
  const pad = list.find(isPadCode), key = list.find(c => !isPadCode(c));
  const c = mode === 'num' ? pad || key : key || pad;
  if (!c) return '–';
  if (/^2x:/i.test(c)){ const l = keyLabel(c.slice(3)); return `${l} ${l}`; }
  return keyLabel(c);
}
// Physical layout of the 18-key keypad (Num / * − | 7 8 9 + | 4 5 6 ← | 1 2 3 Enter | 0 . )
const KEYPAD = [
  { code:'NumLock', c:1, r:1 }, { code:'NumpadDivide', c:2, r:1 }, { code:'NumpadMultiply', c:3, r:1 }, { code:'NumpadSubtract', c:4, r:1 },
  { code:'Numpad7', c:1, r:2 }, { code:'Numpad8', c:2, r:2 }, { code:'Numpad9', c:3, r:2 }, { code:'NumpadAdd', c:4, r:2 },
  { code:'Numpad4', c:1, r:3 }, { code:'Numpad5', c:2, r:3 }, { code:'Numpad6', c:3, r:3 }, { code:'Backspace', c:4, r:3 },
  { code:'Numpad1', c:1, r:4 }, { code:'Numpad2', c:2, r:4 }, { code:'Numpad3', c:3, r:4 }, { code:'NumpadEnter', c:4, r:4, rs:2 },
  { code:'Numpad0', c:1, r:5, cs:2 }, { code:'NumpadDecimal', c:3, r:5 }
];
const kpGrid = $('kpGrid'), keypadEl = $('keypad');
const roleName = a => { const n = scene() && scene().names[a]; return n ? n.replace(' starten', '') : ACTION_NAMES[a]; };
function buildKeypad(){
kpGrid.textContent = '';
$('keypad').querySelector('.kp-head').textContent = `Tastenbelegung Ziffernblock: ${scene().name}`;
for (const c of KEYPAD){
  const act = KEYBIND.get(c.code.toLowerCase()), act2 = DOUBLEBIND.get(c.code.toLowerCase());
  const d = document.createElement('div');
  d.className = 'kp-cell';
  d.style.gridColumn = `${c.c} / span ${c.cs || 1}`; d.style.gridRow = `${c.r} / span ${c.rs || 1}`;
  const b = document.createElement('b'); b.textContent = keyLabel(c.code);
  const sp = document.createElement('span'); sp.textContent = (act ? roleName(act) : '–') + (act2 ? `, 2×: ${roleName(act2)}` : '');
  d.append(b, sp); kpGrid.append(d);
}
}
let helpTimer = null;
const helpOpen = () => !keypadEl.hidden;
function closeHelp(){ keypadEl.hidden = true; clearTimeout(helpTimer); }
function toggleHelp(){
  if (helpOpen()){ closeHelp(); return; }
  hideMenu(); keypadEl.hidden = false;
  clearTimeout(helpTimer); helpTimer = setTimeout(closeHelp, 30000);
}
keypadEl.addEventListener('pointerdown', e => e.stopPropagation());
$('kpClose').addEventListener('click', closeHelp);
$('kpPrint').addEventListener('click', () => { try { window.print(); } catch (e) {} });

function setHints(mode){
  settings.hints = mode;
  menu.querySelectorAll('button[data-act]').forEach(b => { const k = b.querySelector('kbd'); if (k) k.textContent = labelFor(b.dataset.act, mode); });
  const L = a => labelFor(a, mode);
  $('tip').textContent = mode === 'num'
    ? `Ziffernblock: Enter öffnet das Menü, dann wählen 8, 2, 4, 6, und Enter oder 5 bestätigt. Rücktaste schließt.`
    : `Klick ins Wasser füttert, Doppelklick klopft. Umschalt+${L('track')} spielt den vorigen Track. Fernbedienung: Pfeile wählen, OK bestätigt.`;
}
const ARROWS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
let lastFocus = null;
menu.addEventListener('focusin', e => { lastFocus = e.target; });
function navMenu(dir){
  const btns = [...menu.querySelectorAll('button')];
  const cur = document.activeElement;
  if (!dir || !btns.includes(cur)){
    const b = lastFocus && btns.includes(lastFocus) ? lastFocus : btns[0];
    b.focus(); b.scrollIntoView({ block:'nearest' }); return;
  }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bd = 1e9;
  for (const b of btns){
    if (b === cur) continue;
    const q = b.getBoundingClientRect(), dx = q.left + q.width/2 - cx, dy = q.top + q.height/2 - cy;
    const ok = dir === 'left' ? dx < -2 : dir === 'right' ? dx > 2 : dir === 'up' ? dy < -2 : dy > 2;
    if (!ok) continue;
    const horiz = dir === 'left' || dir === 'right';
    const d = (horiz ? Math.abs(dx) : Math.abs(dy)) + (horiz ? Math.abs(dy) : Math.abs(dx)) * 3;
    if (d < bd){ bd = d; best = b; }
  }
  if (best){ best.focus(); best.scrollIntoView({ block:'nearest' }); }
}
const isZen = () => document.body.classList.contains('zen');
const inMenu = el => el && el.closest && el.closest('#menu, #keypad');
const QUIET = ['zen', 'menu', 'help', 'date'];

function doBack(){ if (helpOpen()) closeHelp(); else if (isZen()) setZen(false); else hideMenu(); }
const PADNAV = { Numpad8:'up', Numpad2:'down', Numpad4:'left', Numpad6:'right' };
let pendingTap = null;
function fireAct(act, info){
  if (act === 'track' && info.shiftKey) act = 'trackPrev';
  if (!isMedia(info.code)){ const mode = info.pad ? 'num' : 'key'; if (settings.hints !== mode) setHints(mode); }
  if (act === 'back'){ doBack(); return; }
  if (helpOpen() && act !== 'help') closeHelp();
  run(act);
  if (!QUIET.includes(act)) showMenu();
}
const NAV2PAD = { Insert:'Numpad0', End:'Numpad1', PageDown:'Numpad3', Clear:'Numpad5', Home:'Numpad7', PageUp:'Numpad9', Delete:'NumpadDecimal' };
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'NumLock' || e.key === 'NumLock'){
    e.preventDefault();
    if (window.KIOSK_SHOW_KEYCODES) toast('Taste: NumLock (wird ignoriert)', true);
    return;
  }
  ensureAudio();
  if (dateMode){ dateKey(e); return; }
  let rc = e.code || '';
  if (NAV2PAD[rc] && !KEYBIND.has(rc.toLowerCase()) && !DOUBLEBIND.has(rc.toLowerCase())) rc = NAV2PAD[rc];
  const code = rc.toLowerCase(), key = e.key === ' ' ? 'space' : (e.key || '').toLowerCase();
  const single = KEYBIND.get(code) || (rc === e.code ? KEYBIND.get(key) : null), dbl = DOUBLEBIND.get(code) || (rc === e.code ? DOUBLEBIND.get(key) : null);
  if (window.KIOSK_SHOW_KEYCODES)
    toast(`Taste: code „${e.code || '–'}“, key „${e.key === ' ' ? 'Leer' : e.key}“${single ? ' → ' + ACTION_NAMES[single] : ''}${dbl ? ' (2×: ' + ACTION_NAMES[dbl] + ')' : ''}`, true);
  const pad = isPadCode(rc);
  if (menuNav && menu.classList.contains('show')){
    if (PADNAV[rc]){ e.preventDefault(); showMenu(); navMenu(PADNAV[rc]); return; }
    if (rc === 'Numpad5' || rc === 'NumpadEnter' || e.key === 'Enter'){
      e.preventDefault(); const b = document.activeElement;
      if (b && menu.contains(b)) b.click(); else navMenu(null);
      if (menu.classList.contains('show')) showMenu();
      return;
    }
  }
  if (!pad && (e.key === 'Enter' || e.key === ' ') && inMenu(e.target)){ showMenu(); return; }
  if (single || dbl){
    e.preventDefault();
    if (e.repeat && single !== 'give') return;
    const info = { shiftKey:e.shiftKey, code:rc, pad }, id = code || key;
    if (dbl){
      if (pendingTap && pendingTap.id === id){ clearTimeout(pendingTap.timer); pendingTap = null; fireAct(dbl, info); return; }
      if (pendingTap){ clearTimeout(pendingTap.timer); pendingTap.fire(); }
      const p = { id, fire(){ if (pendingTap === p) pendingTap = null; if (single) fireAct(single, info); } };
      p.timer = setTimeout(() => p.fire(), 320);
      pendingTap = p;
      return;
    }
    if (pendingTap){ clearTimeout(pendingTap.timer); pendingTap.fire(); }
    fireAct(single, info);
    return;
  }
  if (['Escape', 'GoBack', 'BrowserBack'].includes(e.key)){ e.preventDefault(); doBack(); return; }
  if (ARROWS[e.key]){
    e.preventDefault();
    if (helpOpen()) closeHelp();
    if (isZen()){ setZen(false); return; }
    const wasOpen = menu.classList.contains('show');
    menuNav = true; showMenu(); navMenu(wasOpen ? ARROWS[e.key] : null);
    return;
  }
  if (e.key === 'Enter'){
    e.preventDefault();
    if (helpOpen()){ closeHelp(); return; }
    if (isZen()){ setZen(false); return; }
    menuNav = true; showMenu(); navMenu(null);
    return;
  }
  showMenu();
});

let lastTap = { t:0, x:0, y:0 };
cv.addEventListener('pointerdown', e => {

  const x = e.clientX / S, y = e.clientY / S, now = performance.now();

// ================= Szene: Aquarium (Anbindung) =================
const AQUA = {
  id:'aquarium', name:'Aquarium', tracks:TRACKS, inited:false,
  names:{ give:'Geben', add1:'Fisch', add2:'Krabbe', add3:'Pflanze', add4:'Qualle', event:'Ereignis starten', main:'An die Scheibe klopfen', env:'Neue Umgebung' },
  init(saved){
    env = saved && saved.env && Array.isArray(saved.env.plants) ? saved.env : genEnv((rnd() * 2**31) | 0);
    fed = saved ? saved.fed | 0 : 0;
    compilePal(); computeSand();
    fish = []; eggs = []; jellies = [];
    if (saved && Array.isArray(saved.fish)) for (const sf of saved.fish){
      if (!SPECIES[sf.sp]) continue;
      const f = addFish(sf.sp, sf.st === 'fry' ? 'fry' : 'adult', sf.x * W, sf.y * H);
      if (f) f.growth = sf.g || 0;
    }
    if (saved && Array.isArray(saved.eggs)) for (const e of saved.eggs) if (SPECIES[e.sp]) eggs.push({ x:e.x * W, sp:e.sp, t:e.t | 0, n:Math.min(5, e.n | 0) });
    if (!fish.length) [0,1,3,3,4,2].forEach(i => addFish(i));
    spawnCrabs(); oc.x = W * .7; sh.x = W * .2; sh.y = HS * .5;
    for (let i = 0; i < Math.max(1, Math.min(MAXJ, saved && saved.jn | 0 || 1)); i++) jellies.push(newJelly());
    initPlankton();
    this.inited = true;
  },
  activate:aquaActivate, resize:aquaResize, onSeason(){ buildDeco(); }, onPhase(){ for (const f of fish) newTarget(f); },
  update:aquaUpdate, draw:aquaDraw, glow:aquaGlow, reset:aquaReset,
  give(){ doGive(); },
  add1(){
    const sp = randomSpecies(), f = addFish(sp);
    if (!f){ toast('Das Becken ist voll.'); SFX.click(); return; }
    if (sp === GOLD){ SFX.gold(); toast('Ein seltener Goldfisch ist aufgetaucht!'); } else SFX.fish();
  },
  add2(){
    if (crabs.length >= 8){ toast('Für mehr Krabben ist kein Platz.'); SFX.click(); return; }
    if (!env.crabs || !env.crabs.length) env.crabs = crabs.map(c => c.type);
    const ty = rnd() * CRAB_TYPES.length | 0;
    env.crabs.push(ty);
    crabs.push({ type:ty, x:4 + rnd() * Math.max(1, W - 20), dir:rnd() < .5 ? 1 : -1, wait:0, anim:rnd()*2, hidden:0 });
    SFX.crab();
  },
  add3(){
    if (env.plants.length >= MAXP){ toast('Für mehr Pflanzen ist kein Platz.'); SFX.click(); return; }
    env.plants.push(newPlant(rnd)); SFX.plant();
  },
  add4(){
    if (jellies.length >= MAXJ){ toast('Für mehr Quallen ist kein Platz.'); SFX.click(); return; }
    jellies.push(newJelly()); SFX.squish();
  },
  main(){ knock(W/2 + (rnd() - .5) * W * .4, HS * (.3 + rnd()*.3)); },
  env(){ env = genEnv((rnd() * 2**31) | 0); applyEnv(); SFX.env(); toast('Neue Umgebung erzeugt.'); },
  event(){ triggerEvent(bagNext(eventBag, EVENT_KINDS)); },
  tap(x, y){ if (y < HS){ dropFood(x); SFX.feed(); } },
  dtap(x, y){ knock(x, y); },
  stats(){ return [['Fische', fish.length], ['Eier', eggCount()], ['Gefüttert', fed], ['Krabben', crabs.length], ['Pflanzen', env.plants.length], ['Quallen', jellies.length]]; },
  save(){
    return { env, fed, jn:jellies.length,
      fish:fish.map(f => ({ sp:f.sp, st:f.stage, g:+f.growth.toFixed(3), x:+(f.x / W).toFixed(3), y:+(f.y / H).toFixed(3) })),
      eggs:eggs.map(e => ({ x:+(e.x / W).toFixed(3), sp:e.sp, t:e.t, n:e.n })) };
  }

SCENES.aquarium = AQUA;

// ================= Speichern =================
const SKEY = 'aquarium-index-settings', SCKEY = id => 'aquarium-index-' + id;

}

  if (id === 'aquarium') try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

}

// ================= Start =================
const ss = loadSettings();

scene()._W = W; scene()._H = H;

// ----- Tastaturfokus sichern -----
// Manche Kiosk-Player geben der Seite erst nach einer Mausbewegung den Tastaturfokus.
// Die Seite holt ihn sich deshalb beim Start und danach regelmäßig selbst.
document.body.tabIndex = -1;
function grabFocus(){
  try {
    if (!document.hasFocus()) window.focus();
    const a = document.activeElement;
    if (!a || a === document.body || a === document.documentElement) document.body.focus({ preventScroll:true });
  } catch (e) {}
}

window.addEventListener('load', grabFocus);

setInterval(grabFocus, 2000);

// ----- Ruhemodus nach Inaktivität -----
let idleSince = performance.now();
const poke = () => { idleSince = performance.now(); };
for (const ev of ['keydown', 'pointerdown', 'wheel', 'touchstart']) window.addEventListener(ev, poke, { capture:true, passive:true });
setInterval(() => {
  const sec = +CFG.ruhemodusNachSekunden;

}, 1000);

let acc = 0, last = performance.now(), frameNo = 0;
const STEP = 1000 / 60;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 6){ update(); acc -= STEP; n++; }
  if (n === 6) acc = 0;
  if (CFG.leistung !== 'niedrig' || (frameNo++ & 1)) render();
  if (t % 30 === 0 && menu.classList.contains('show')) updateMenu();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
